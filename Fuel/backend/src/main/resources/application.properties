spring.application.name=fuel

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Mail: defaults target the local Mailpit catcher. The "prod" profile
# (application-prod.properties) switches to a real, authenticated SMTP provider.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:any}
spring.mail.password=${MAIL_PASSWORD:any}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=false
# JavaMail waits forever by default; bound it so a stalled provider can't exhaust emailTaskExecutor.
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}

app.mail.from-email-address=${MAIL_FROM:noreply@fuel.local}
app.mail.verification-subject=Verify your email address
app.mail.forgot-password-subject=Forgot Your Password?

#jwt
jwt.secret=${JWT_SECRET}
jwt.access-token-expiry-seconds=900
jwt.refresh-token-expiry-seconds=2592000

#redis rate-limiting
app.rate-limit.resend-verification.max-requests=3
app.rate-limit.resend-verification.window=1h

app.frontend.url=${FRONTEND_URL:https://app.example.com}
app.frontend.reset-password.url=${app.frontend.url}/reset-password?token=

refresh-token.scheduler.cleanup.cron=0 0 3 * * *

#google oauth: comma-separated client IDs (iOS, Android, web) whose ID tokens are accepted
app.oauth.google.client-ids=${GOOGLE_CLIENT_IDS:}
app.oauth.google.jwks-uri=https://www.googleapis.com/oauth2/v3/certs
app.oauth.google.issuers=https://accounts.google.com,accounts.google.com
app.oauth.google.key-cache-ttl=6h
app.oauth.google.key-refresh-min-interval=1m
app.oauth.google.clock-skew=60s
app.oauth.google.http-timeout=5s

#openapi / swagger ui: /swagger-ui.html, spec at /v3/api-docs (disabled in the prod profile)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
