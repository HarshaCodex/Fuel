# Production overrides. Activate with SPRING_PROFILES_ACTIVE=prod.
# Values without a default are required: startup fails if they are missing, so a
# misconfigured deploy can never silently fall back to the local Mailpit catcher.
# See docs/EMAIL_SETUP.md for provider-specific values.

# Mail: real SMTP provider (Amazon SES, SendGrid, Brevo, Resend, Postmark, Gmail, ...)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# A missing MAIL_HOST already fails startup, but @ConfigurationProperties binding leaves an
# unresolved MAIL_USERNAME/MAIL_PASSWORD as a literal string. Connecting + authenticating at startup
# makes missing or wrong credentials fail the deploy instead of the first user's sign-up.
spring.mail.test-connection=true

# Must be an address on a domain verified with the provider (SPF/DKIM), or mail is rejected or spam-foldered.
app.mail.from-email-address=${MAIL_FROM}

app.frontend.url=${FRONTEND_URL}

# API docs are a development aid; don't publish the API surface from production.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
