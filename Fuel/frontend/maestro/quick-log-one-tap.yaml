# One-tap logging from Recent: tap "+", see the toast, Undo, log again, close and see Today change.
appId: com.harshacodex.fuel
name: One-tap log from Quick Log
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Create an account"
    timeout: 90000
- tapOn:
    text: "Email"
    index: 1
- inputText: ${LAB_EMAIL}
- tapOn:
    text: "Password"
    index: 1
- inputText: ${LAB_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "kcal left"
    timeout: 30000
- copyTextFrom:
    text: ".* of .* eaten.*"
- evalScript: ${output.eatenBefore = maestro.copiedText}
- tapOn: "Log food"
- extendedWaitUntil:
    visible: "(?i)recent"
    timeout: 15000
- hideKeyboard
- tapOn: "Log Rice, white, cooked.*"
- extendedWaitUntil:
    visible: "Added to .* kcal"
    timeout: 15000
- takeScreenshot: 01-added-toast
- tapOn: "Undo"
- assertNotVisible: "Added to .* kcal"
- tapOn: "Log Rice, white, cooked.*"
- extendedWaitUntil:
    visible: "Added to .* kcal"
    timeout: 15000
- tapOn: "Close"
- extendedWaitUntil:
    visible: "kcal left"
    timeout: 30000
- copyTextFrom:
    text: ".* of .* eaten.*"
- assertTrue: ${maestro.copiedText != output.eatenBefore}
- takeScreenshot: 02-today-after
