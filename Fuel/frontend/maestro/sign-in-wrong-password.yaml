# A wrong password shows the credentials error and stays on sign-in; the right one then reaches Today.
appId: com.harshacodex.fuel
name: Sign in with wrong then right password
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Create an account"
    timeout: 90000
- takeScreenshot: 01-sign-in
- tapOn:
    text: "Email"
    index: 1
- inputText: ${LAB_EMAIL}
- tapOn:
    text: "Password"
    index: 1
- inputText: "Wrong-Password-1!"
- hideKeyboard
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Email or password is incorrect"
    timeout: 30000
- assertVisible: "Create an account"
- takeScreenshot: 02-credentials-error
- tapOn:
    text: "Password"
    index: 1
- eraseText: 40
- inputText: ${LAB_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "kcal left"
    timeout: 30000
- assertVisible: "Today"
- takeScreenshot: 03-today
