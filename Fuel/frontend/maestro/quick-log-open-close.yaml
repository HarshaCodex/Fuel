# The + button opens Quick Log with its four ways to log food, and Close returns to Today.
appId: com.harshacodex.fuel
name: Quick Log opens and closes
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Create an account"
    timeout: 90000
- tapOn:
    text: "Email"
    index: 1
- inputText: ${LAB_EMAIL}
- tapOn:
    text: "Password"
    index: 1
- inputText: ${LAB_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "kcal left"
    timeout: 30000
- takeScreenshot: 01-today
- tapOn: "Log food"
- extendedWaitUntil:
    visible: "Search foods"
    timeout: 15000
- assertVisible: "Scan barcode"
- assertVisible: "Enter manually"
- assertVisible: "My Foods"
- takeScreenshot: 02-quick-log
- tapOn: "Close"
- extendedWaitUntil:
    visible: "kcal left"
    timeout: 15000
- assertNotVisible: "Search foods"
- takeScreenshot: 03-back-on-today
