# Forgot password sends a code and reaches the reset-code screen.
appId: com.harshacodex.fuel
name: Forgot password
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Create an account"
    timeout: 90000
- tapOn: "Forgot password?"
- extendedWaitUntil:
    visible: "Send code"
    timeout: 15000
- takeScreenshot: 01-forgot-password
- tapOn:
    text: "Email"
    index: 1
- inputText: ${LAB_EMAIL}
- hideKeyboard
- tapOn: "Send code"
- extendedWaitUntil:
    visible: "Enter code"
    timeout: 30000
- takeScreenshot: 02-code-sent
- tapOn: "Enter code"
- extendedWaitUntil:
    visible: "Choose a new password"
    timeout: 15000
- takeScreenshot: 03-reset-password
