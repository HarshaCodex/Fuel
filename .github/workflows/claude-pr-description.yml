name: Claude PR Description

on:
  pull_request:
    types: [opened]

jobs:
  describe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Write PR description
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The prompt asks Claude to read the diff and edit the PR body via gh.
          # claude-code-action does NOT auto-allow write commands like `gh pr edit`,
          # so without this allowlist every edit attempt is permission-denied and the
          # job still reports "success" while never touching the body.
          claude_args: |
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr edit:*)"
          prompt: 'Write a clear, well-structured description for ${{ github.repository }}/pull/${{ github.event.pull_request.number }} based on its diff, and update the PR body via the gh CLI. Update the PR body only — do not post a comment on the pull request.'
